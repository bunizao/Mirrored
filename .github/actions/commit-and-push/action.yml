name: Commit and push
description: >
  Commit changes under the given paths and push them, rebasing onto concurrent
  pushes from other workflows. With `push: false` it only reports the diff.

inputs:
  paths:
    description: Space-separated pathspecs to stage.
    required: true
  message:
    description: Commit message.
    required: true
  push:
    description: Set to "false" for a dry run (e.g. when not on the default branch).
    default: "true"

outputs:
  pushed:
    description: '"true" when a commit was pushed.'
    value: ${{ steps.commit.outputs.pushed }}

runs:
  using: composite
  steps:
    - id: commit
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
        PUSH: ${{ inputs.push }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        read -r -a pathspecs <<< "$PATHS"

        git add -A -- "${pathspecs[@]}"
        if git diff --cached --quiet; then
          echo "No changes to commit."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        {
          echo "## Changed files"
          echo '```'
          git diff --cached --stat
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$PUSH" != "true" ]; then
          echo "Dry run: changes are reported but not committed."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit --quiet -m "$MESSAGE"

        # Other scheduled workflows push to the same branch. They touch disjoint
        # paths, so rebasing onto theirs is always conflict-free.
        for attempt in 1 2 3 4 5; do
          if git push --quiet origin "HEAD:${BRANCH}"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Push rejected (attempt ${attempt}); rebasing onto origin/${BRANCH}."
          sleep $((attempt * 3))
          git pull --quiet --rebase --autostash origin "$BRANCH"
        done

        echo "::error::Could not push after 5 attempts."
        exit 1
